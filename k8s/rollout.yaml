apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: cloud05-service
  namespace: cloud05-app
  labels:
    app.kubernetes.io/name: cloud05-service
spec:
  replicas: 4
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: cloud05-service
  strategy:
    canary:
      # Services used for replica-ratio canary routing (no service mesh installed)
      stableService: cloud05-active-service
      canaryService: cloud05-preview-service
      steps:
        - setWeight: 10
        - pause: { duration: 15s }
        - analysis:
            templates:
              - templateName: cloud05-health-analysis
            args:
              - name: latest-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 25
        - pause: { duration: 15s }
        - analysis:
            templates:
              - templateName: cloud05-health-analysis
            args:
              - name: latest-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 50
        - pause: { duration: 15s }
        - analysis:
            templates:
              - templateName: cloud05-health-analysis
            args:
              - name: latest-hash
                valueFrom:
                  podTemplateHashValue: Latest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloud05-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5005"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: cloud05-app-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: app
          image: cloud05-capstone:v1.0.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: RELEASE_VERSION
              value: "v1.0.1"
            - name: FAULT_MODE
              value: "false"
          ports:
            - name: http
              containerPort: 5005
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cloud05-config
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5005
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /ready
              port: 5005
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: tmp-dir
          emptyDir: {}

apiVersion: v1
kind: Service
metadata:
  name: cloud05-active-service
  namespace: cloud05-app
  labels:
    app.kubernetes.io/name: cloud05-service
    role: active
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 5005
      protocol: TCP
    - name: metrics
      port: 5005
      targetPort: 5005
      protocol: TCP
  selector:
    app.kubernetes.io/name: cloud05-service
---
apiVersion: v1
kind: Service
metadata:
  name: cloud05-preview-service
  namespace: cloud05-app
  labels:
    app.kubernetes.io/name: cloud05-service
    role: preview
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 5005
      protocol: TCP
  selector:
    app.kubernetes.io/name: cloud05-service

apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: order-service
  namespace: cloud05-app
  labels:
    app.kubernetes.io/name: order-service
    service-tier: business
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  strategy:
    canary:
      canaryService: order-preview-service
      stableService: order-active-service
      steps:
        - setWeight: 10
        - pause: { duration: 15s }
        - analysis:
            templates:
              - templateName: order-service-health-analysis
            args:
              - name: latest-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 25
        - pause: { duration: 15s }
        - analysis:
            templates:
              - templateName: order-service-health-analysis
            args:
              - name: latest-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 50
        - pause: { duration: 15s }
        - analysis:
            templates:
              - templateName: order-service-health-analysis
            args:
              - name: latest-hash
                valueFrom:
                  podTemplateHashValue: Latest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5006"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: order-app
          image: cloud05-order-service:v1.0.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: RELEASE_VERSION
              value: "v1.0.1"
            - name: FAULT_MODE
              value: "false"
          ports:
            - name: http
              containerPort: 5006
              protocol: TCP
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5006
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /ready
              port: 5006
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: tmp-dir
          emptyDir: {}

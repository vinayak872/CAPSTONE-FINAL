apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: cloud05-health-analysis
  namespace: cloud05-app
  labels:
    app.kubernetes.io/name: cloud05-service
spec:
  args:
    - name: latest-hash
  metrics:
    - name: success-rate
      interval: 10s
      count: 3
      successCondition: len(result) > 0 && result[0] >= 95
      failureLimit: 1
      inconclusiveLimit: 2
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local:9090
          query: |
            (
              sum(rate(cloud05_http_requests_total{rollouts_pod_template_hash="{{args.latest-hash}}",status_code!~"5.."}[1m]))
              /
              sum(rate(cloud05_http_requests_total{rollouts_pod_template_hash="{{args.latest-hash}}"}[1m]))
            ) * 100

    - name: error-rate-threshold
      interval: 10s
      count: 3
      successCondition: len(result) > 0 && result[0] <= 5
      failureLimit: 1
      inconclusiveLimit: 2
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local:9090
          query: |
            (
              sum(rate(cloud05_http_requests_total{rollouts_pod_template_hash="{{args.latest-hash}}",status_code=~"5.."}[1m]))
              /
              sum(rate(cloud05_http_requests_total{rollouts_pod_template_hash="{{args.latest-hash}}"}[1m]))
            ) * 100
---

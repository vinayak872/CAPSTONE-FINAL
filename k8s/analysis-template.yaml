apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: cloud05-health-analysis
  namespace: cloud05-app
  labels:
    app.kubernetes.io/name: cloud05-service
spec:
  metrics:
    - name: success-rate
      interval: 10s
      count: 3
      successCondition: result[0] >= 95
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local:9090
          query: |
            (
              (
                sum(rate(cloud05_http_requests_total{status_code=~"2.."}[1m]))
                /
                sum(rate(cloud05_http_requests_total[1m]))
              ) * 100
            ) or on() vector(100)

    - name: error-rate-threshold
      interval: 10s
      count: 3
      successCondition: result[0] <= 5
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local:9090
          query: |
            (
              (
                sum(rate(cloud05_http_requests_total{status_code=~"5.."}[1m]))
                /
                sum(rate(cloud05_http_requests_total[1m]))
              ) * 100
            ) or on() vector(0)

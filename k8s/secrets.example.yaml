# Example Kubernetes Secret template (DO NOT commit real credentials to Git).
# Create the secret imperatively in your local cluster instead:
#
#   kubectl create secret generic cloud05-secrets \
#     --namespace cloud05-app \
#     --from-literal=ADMIN_API_TOKEN="$(openssl rand -hex 24)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
apiVersion: v1
kind: Secret
metadata:
  name: cloud05-secrets
  namespace: cloud05-app
type: Opaque
stringData:
  ADMIN_API_TOKEN: "replace-with-generated-token"

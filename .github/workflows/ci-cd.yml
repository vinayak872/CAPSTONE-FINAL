name: CLOUD-05 CI/CD & Progressive Delivery Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # --- Stage 1: Validation, Linting & Unit/Integration Tests ---
  test:
    name: 1. Test & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run JavaScript Unit & Integration Tests
        working-directory: ./backend
        run: npm test

      - name: Security Vulnerability Audit
        working-directory: ./backend
        run: npm audit --audit-level=high || true

  # --- Stage 2: Container Image Build & Health Verification ---
  build:
    name: 2. Container Build & Image Security
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Multi-Stage Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: cloud05-capstone:ci-${{ github.sha }}
          load: true

      - name: Verify Container Healthcheck
        run: |
          docker run -d --name test-cloud05 -p 5005:5005 cloud05-capstone:ci-${{ github.sha }}
          sleep 5
          docker ps
          curl -f http://localhost:5005/health || exit 1
          curl -f http://localhost:5005/ready || exit 1
          curl -f http://localhost:5005/metrics || exit 1
          docker stop test-cloud05

  # --- Stage 3: GitOps Manifest Validation ---
  gitops-validate:
    name: 3. GitOps Manifests & Argo Rollouts Validation
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Validate Kubernetes Manifests with Kustomize
        run: |
          kubectl kustomize k8s/ > /dev/null
          echo "Kustomize manifest syntax validated successfully"

      - name: GitOps Dry-Run Update Verification
        run: |
          echo "Simulating GitOps image tag update in k8s/kustomization.yaml to ci-${{ github.sha }}"
          cd k8s
          kubectl kustomize . | grep -q "cloud05-capstone"
          echo "GitOps reconciliation state verified for Argo CD consumption"
